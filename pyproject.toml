[project]
name = "email-triage-openenv"
version = "1.0.0"
description = "AI-powered email triage environment"
authors = [{ name = "Anil Kumar" }]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "requests",
    "openenv>=0.1.13"
]

[project.scripts]
server = "server.app:main"

[tool.openenv]
entrypoint = "server.app:app"
