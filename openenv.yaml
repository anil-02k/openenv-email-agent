name: email-triage-openenv
version: "1.0.0"
description: AI-powered email triage and response environment

entrypoint:
  module: server.app
  object: app

observation_space:
  type: object
  properties:
    emails:
      type: array
    processed:
      type: integer
    correct:
      type: integer

action_space:
  type: object
  properties:
    email_id:
      type: integer
    action_type:
      type: string
    response:
      type: string

reward:
  type: float
  range: [-1.0, 1.0]

tasks:
  - name: easy
    description: classify emails correctly
  - name: medium
    description: generate meaningful replies
  - name: hard
    description: optimize overall reward
